schema_version: 1

context:
  version: "0.10.2"

package:
  name: fps-auth-fief
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/f/fps-auth-fief/fps_auth_fief-${{ version }}.tar.gz
    sha256: d75c2c9737bc7d0a6dbfe6efb365670669c3552b37168dba0faa0f0ecfb66190

build:
  noarch: python
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build
  run:
    - python >=${{ python_min }}
    - fastapi-core
    - fief-client-fastapi
    - fps
    - httpx
    - jupyverse-api >=0.15.0,<0.16.0
    - jupyverse-auth >=0.2.0,<0.3.0
    - pydantic

tests:
  - python:
      imports: fps_auth_fief
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  license: BSD-3-Clause
  license_file: COPYING.md
  homepage: https://github.com/jupyter-server/jupyverse/tree/main/plugins/auth_fief
  summary: An FPS plugin for the authentication API, using Fief.

extra:
  recipe-maintainers:
    - davidbrochart
